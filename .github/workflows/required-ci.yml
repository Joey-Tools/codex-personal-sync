name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-personal-sync' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          repository: Joey-Tools/codex-personal-sync
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify canonical source lock
        run: python3 scripts/sync_canonical_mirrors.py refresh-lock --check
      - name: Compile
        run: python3 -m compileall -q scripts tests
      - name: Run tests
        shell: bash
        run: >-
          bash scripts/run_ci_tests_with_private_tmp.sh --
          python3 -m unittest discover -s tests
