name: Required CI

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify canonical source lock
        run: python3 scripts/sync_canonical_mirrors.py refresh-lock --check
      - name: Compile
        run: python3 -m compileall -q scripts tests
      - name: Run tests
        shell: bash
        run: >-
          bash scripts/run_ci_tests_with_private_tmp.sh --
          python3 -m unittest discover -s tests
