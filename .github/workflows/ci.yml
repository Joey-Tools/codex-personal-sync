name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify canonical source lock
        run: python3 scripts/sync_canonical_mirrors.py refresh-lock --check
      - name: Compile
        run: python3 -m compileall -q scripts tests
      - name: Run tests
        run: python3 -m unittest discover -s tests
