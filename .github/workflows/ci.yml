name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify canonical source lock
        run: python3 scripts/sync_canonical_mirrors.py refresh-lock --check
      - name: Compile
        run: python3 -m compileall -q scripts tests
      - name: Run tests
        shell: bash
        run: >-
          bash scripts/run_ci_tests_with_private_tmp.sh --
          python3 -m unittest discover -s tests

  macos-system-temp-alias:
    name: macOS system temp alias (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 exercises the literal O_SYMLINK fallback; Python 3.13
        # exercises the runtime-provided flag used by the current native lane.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify Darwin system temp alias
        run: >-
          python3 -c 'from pathlib import Path; import sys;
          assert sys.platform == "darwin";
          assert Path("/tmp").is_symlink();
          assert Path("/tmp").resolve() == Path("/private/tmp")'
      - name: Run Darwin alias binding tests
        run: >-
          python3 -m unittest discover -s tests
          -p 'test_codex_personal_sync.py'
          -k macos_system_temp_alias
      - name: Run Python 3.9 pending regular compatibility test
        if: matrix.python-version == '3.9'
        run: >-
          python3 -m unittest
          tests.test_pending_agent_claim_compatibility.PendingAgentClaimCompatibilityTests.test_terminal_regular_source_validation_preflights_whole_group
      - name: Run Python 3.9 pending cleanup failure compatibility test
        if: matrix.python-version == '3.9'
        run: >-
          python3 -m unittest
          tests.test_pending_agent_claim_compatibility.PendingAgentClaimCompatibilityTests.test_internal_file_fchmod_and_cleanup_failure_remains_fail_closed
      - name: Run Python 3.9 regular-to-symlink migration recovery tests
        if: matrix.python-version == '3.9'
        run: >-
          python3 -m unittest
          tests.test_regular_agent_materialization.PublicRegularAgentTests.test_exact_same_target_removal_migrates_regular_agent_to_symlink
          tests.test_regular_agent_materialization.RegularAgentPendingRecoveryTests.test_regular_to_symlink_precommit_recovery_restores_exact_regular_file
      - name: Run macOS Git locator tests
        run: >-
          python3 -m unittest discover -s tests
          -p 'test_source_lock.py'
          -k macos_git_locator
